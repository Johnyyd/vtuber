<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTuber 3D Avatar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="canvas-container">
    <canvas id="avatar-canvas"></canvas>
  </div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Loading 3D Model...</div>
  </div>

  <div id="hud-overlay">
    <div class="hud-pill">
      <span class="status-dot"></span>
      <span id="hud-status">Live Tracking</span>
      <span class="divider">|</span>
      <span id="hud-fps">60 FPS</span>
      <span class="divider">|</span>
      <span id="hud-expression">Rest</span>
    </div>
  </div>

  <!-- Local Offline Libraries -->
  <script src="libs/three.min.js"></script>
  <script src="libs/GLTFLoader.js"></script>
  <script src="libs/three-vrm.min.js"></script>
  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
